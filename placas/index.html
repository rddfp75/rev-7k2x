.pn{position:absolute;transform:translate(-50%,-50%);border-radius:99px;pointer-events:none}

<script>
(function(){
const DBN='placas-web',ST='blobs';
const open=()=>new Promise((ok,ko)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
let dbp;const getdb=()=>dbp||(dbp=open());
const tx=async(m,f)=>{const d=await getdb();return new Promise((ok,ko)=>{const t=d.transaction(ST,m);const r=f(t.objectStore(ST));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>ko(t.error);t.onabort=()=>ko(t.error)})};
const rid=()=>{const a=new Uint8Array(12);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')};
const assets={async upload(b){const id=rid();await tx('readwrite',s=>s.put(b,id));return{id,url:'/_blob/'+id,sizeBytes:b.size,contentType:b.type}},async delete(id){await tx('readwrite',s=>s.delete(id))}};
const downloads={async save(o){const f=o.filename,d=o.data;const b=d instanceof Blob?d:new Blob([d],{type:/\.pdf$/i.test(f)?'application/pdf':/\.zip$/i.test(f)?'application/zip':'application/octet-stream'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=f;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),120000)}};
window.claude={use:async n=>n==='assets'?assets:n==='downloads'?downloads:null};
const of=window.fetch.bind(window);
window.fetch=async(u,...a)=>{const m=String(u).match(/^\/_blob\/([0-9a-f]+)/);if(!m)return of(u,...a);let b=null;try{b=await tx('readonly',st=>st.get(m[1]))}catch(e){}return b?new Response(b,{status:200,headers:{'Content-Type':b.type||'image/jpeg'}}):new Response(null,{status:404})};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script>

function plOpen(k,r){plK=k;plZ=3;plRs=[...new Set(res(k).filter(x=>x.p.length).map(x=>x.r))];if(!plRs.length)return;plR=r||plRs[0];plHead();
 const im=$('#pli');im.onload=()=>plShow(true);im.src='p/'+plR+'.jpg';$('#pl').hidden=false;if(im.complete&&im.naturalWidth)plShow(true)}
function plZoom(k){const sc=$('#pls'),w=$('#plw');const cx=(sc.scrollLeft+sc.clientWidth/2)/w.clientWidth,cy=(sc.scrollTop+sc.clientHeight/2)/w.clientHeight;plZ=Math.min(8,Math.max(1,plZ*k));plShow(false);sc.scrollLeft=cx*w.clientWidth-sc.clientWidth/2;sc.scrollTop=cy*w.clientHeight-sc.clientHeight/2}
// ---- asignar en plano ----
let asK=null,asR='zl',asQ='';
function asOpen(k){asK=k;if(!S.map[k])S.map[k]=(SUG[k]||[]).map(x=>x.slice());save();const f=refs(k)[0];asR=f?f[0]:asR;asQ='';$('#as').hidden=false;asRender()}
function asRender(){const p=P(asK);$('#ast').innerHTML='<b>'+p.no+'</b> · <span class="enm">'+esc(p.n)+'</span>';
 $('#asc').innerHTML=S.map[asK].length?S.map[asK].map(([r,m],i)=>`<button class="chip on" data-asd="${i}">${esc(m)} ✕</button>`).join(''):'<span class="sub">Nada asignado. Busca abajo y toca para añadir.</span>';
 $('#asr').innerHTML=Object.keys(ROOMS).map(r=>`<option value="${r}" ${r===asR?'selected':''}>${esc(ROOMS[r].s)}</option>`).join('');asList()}
function asList(){const t=asQ.toLowerCase();const L=(LST[asR]||[]).filter(k=>{const e=ENT[k];return!t||(k+' '+e[0]).toLowerCase().includes(t)}).slice(0,120);
 $('#asl').innerHTML=L.map(k=>{const [r,m]=[k.split('|')[0],k.slice(k.indexOf('|')+1)],e=ENT[k],on=S.map[asK].some(x=>x[0]===r&&x[1]===m);return `<button class="pt ${on?'sel':''}" style="display:block;width:100%;text-align:left" data-asa="${esc(k)}"><b class="mat">${esc(m)}</b> ${esc(e[0])}${e[1].length?'':' <span class="sub">(sin posición)</span>'}</button>`}).join('')||'<p class="warn">Nada con ese filtro.</p>'}
document.addEventListener('click',async e=>{const t=e.target.closest('button,.pt');if(!t)return;
 const D_=t.dataset;
 if(D_.plr){plR=D_.plr;plHead();const im=$('#pli');im.onload=()=>plShow(true);im.src='p/'+plR+'.jpg';if(im.complete&&im.naturalWidth)plShow(true);return}
 if(D_.pl){plOpen(D_.pl);return}
 if(D_.ph){phOpen(D_.ph);return}
 if(D_.pf){const c=t.closest('.pt');phOpenPl(c.dataset.k,+c.dataset.i,D_.pf==='ent'?'fe':'fa');return}
 if(D_.pg){const c=t.closest('.pt');phOpenPl(c.dataset.k,+c.dataset.i,D_.pg==='ent'?'fe':'fa',true);return}
 if(D_.su){tab='su';render();scrollTo(0,0);return}
 if(D_.suback){tab='rc';render();scrollTo(0,0);return}
 if(D_.sunew){S.sueltos.push({id:Date.now(),name:'',t:'E',t0:Date.now()});save();render();return}
 if(D_.sf){phOpenSu(+D_.sf,false);return}
 if(D_.sg){phOpenSu(+D_.sg,true);return}
 if(D_.sty){const m=suGet(D_.suid);if(m&&!suBusy(m)){m.t=D_.sty;save();render()}return}
 if(D_.sd){if(!D_.c){D_.c=1;t.textContent='Confirmar';return}const m=suGet(D_.sd);if(m){for(const f of['fe','fa'])if(m[f]){try{await ASS.delete(m[f])}catch(e){}}S.sueltos=S.sueltos.filter(x=>x.id!==m.id);save();render()}return}
 if(D_.sp||D_.supdfall){const L=D_.sp?[suGet(D_.sp)]:[...S.sueltos].reverse();const out=$('#sum');if(out)out.textContent='Preparando PDF…';try{const b=await mkPdfSu(L);const d=await claude.use('downloads');if(!d){if(out)out.textContent='Descarga no disponible aquí.'}else{const nm=L.length===1?(L[0].name||'suelto'):'todos';await d.save({filename:'recuento-'+nm.replace(/[^\w-]+/g,'_')+'.pdf',data:b});if(out)out.textContent='PDF listo.'}}catch(er){if(out)out.textContent='No se guardó: '+(er.message||er.code||er)}return}
 if(D_.trx){const out=$('#trm');out.textContent='Preparando…';try{const n=await trExport();out.textContent=n?'Archivo listo ('+n+' fotos).':'No hay fotos.'}catch(er){out.textContent='No se guardó: '+(er.message||er.code||er)}return}
 if(t.id==='phgb'){$('#phg').click();return}
 if(t.id==='phx'){$('#ph').hidden=true;return}
 if(t.id==='phc'){$('#phf').click();return}
 if(t.id==='phd'){if(!D_.c){D_.c=1;t.textContent='Confirmar';return}const id=phGetId();phSetId(null);save();try{await ASS.delete(id)}catch(e){}$('#ph').hidden=true;render();return}
 if(D_.as){asOpen(D_.as);return}
 if(D_.asd!==undefined){S.map[asK].splice(+D_.asd,1);save();asRender();return}
 if(D_.asa){const i=D_.asa.indexOf('|'),r=D_.asa.slice(0,i),m=D_.asa.slice(i+1),a=S.map[asK],j=a.findIndex(x=>x[0]===r&&x[1]===m);if(j>=0)a.splice(j,1);else a.push([r,m]);save();asRender();return}
 if(t.id==='asx'){$('#as').hidden=true;render();return}
 if(t.id==='plx'){$('#pl').hidden=true;return}
 if(t.id==='plp'){plZoom(1.5);return}
 if(t.id==='plm'){plZoom(1/1.5);return}
 if(D_.t){tab=D_.t;render();scrollTo(0,0);return}
 if(D_.hoja!==undefined){hoja=D_.hoja;sec='';render();return}
 if(D_.q){S.q=+D_.q;TPL.forEach(p=>{if(p.h!=='p'||!(p.q===1||p.q===2)||!hm(p)||(sec&&p.h+'|'+p.s!==sec))return;if(p.q===S.q)addPt(p);else if(S.sel[p.k]&&!S.sel[p.k].sm.some(m=>m.est))delete S.sel[p.k]});save();render();return}
 if(t.id==='cq'){const R=snapRows();if(!R.length){$('#cqm').textContent='No hay recuentos que guardar todavía.';return}if(!D_.c){D_.c=1;t.textContent='Confirmar: cerrar '+nameQ();return}S.hist.push({id:Date.now(),name:nameQ(),div:S.div,rows:R,q:S.q,label:S.label,sel:JSON.parse(JSON.stringify(S.sel))});S={label:'',q:0,div:S.div,sel:{},map:S.map,photos:S.photos,hist:S.hist,sueltos:S.sueltos};save();tab='seg';render();return}
 if(t.id==='vac'){if(D_.c){S={label:'',q:0,div:S.div,sel:{},map:S.map,photos:S.photos,hist:S.hist||[],sueltos:S.sueltos||[]};save();tab='sel';render();return}D_.c=1;t.textContent='Confirmar: borrar todo';return}
 if(D_.hp!==undefined){const h=S.hist[+D_.hp],bk={sel:S.sel,q:S.q,label:S.label};$('#cqm').textContent='Preparando PDF…';try{S.sel=h.sel;S.q=h.q;S.label=h.label;const b=await mkPdf();S.sel=bk.sel;S.q=bk.q;S.label=bk.label;const d=await claude.use('downloads');if(!d)$('#cqm').textContent='Descarga no disponible aquí.';else{await d.save({filename:'muestreo-'+h.name.replace(/[^\w-]+/g,'_')+'.pdf',data:b});$('#cqm').textContent='PDF listo.'}}catch(er){$('#cqm').textContent='No se guardó: '+(er.message||er)}finally{S.sel=bk.sel;S.q=bk.q;S.label=bk.label}return}
 if(t.id==='pdf'){msg='';try{const b=await mkPdf();const d=await claude.use('downloads');if(!d){msg='Descarga no disponible aquí.'}else{await d.save({filename:'muestreo-'+(S.label||'quincena').replace(/[^\w-]+/g,'_')+'.pdf',data:b});msg='PDF listo.'}}catch(er){msg='No se guardó: '+(er.message||er.code||er)}$('#m').textContent=msg;return}
 const c=t.closest('.pt');if(!c||!c.dataset.k)return;const k=c.dataset.k;
 if(tab==='sel'&&t.classList.contains('pt')){if(S.sel[k])delete S.sel[k];else addPt(P(k));save();render();return}
 if(tab==='mu'&&D_.a){const sm=t.closest('.sm');const m=S.sel[k].sm[+sm.dataset.i];m.est=(m.est===D_.v)?'':D_.v;if(m.est==='ok'){if(!m.t0)m.t0=Date.now()}else m.t0=0;save();render()}
});
document.addEventListener('input',e=>{const i=e.target;
 if(i.id==='lab'){S.label=i.value;save();return}
 if(i.id==='q'){q=i.value;const p=i.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p);return}
 if(i.id==='sec'){sec=i.value;render();return}
 if(i.id==='asr'){asR=i.value;asList();return}
 if(i.id==='asq'){asQ=i.value;asList();return}
 const c=i.closest('.pt');if(!c||!i.dataset.f||!c.dataset.k)return;const x=S.sel[c.dataset.k],f=i.dataset.f;
 if(f==='inc'){x.inc=i.value;save();return}
 const sm=i.closest('.sm'),idx=sm?+sm.dataset.i:+(c.dataset.i||0),m=x.sm[idx];
 m[f]=(f==='aer'||f==='ent')?i.value.replace(/\D/g,''):i.value;if(f==='ent')delete m.xe;if(f==='aer')delete m.xa;save();
 if(f==='aer'||f==='ent'){i.classList.toggle('lleno',!!m[f]);c.querySelector(`[data-r=${f}]`).textContent=fx(m[f])}});
render();

</script>
