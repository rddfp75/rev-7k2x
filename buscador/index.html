<title>Buscador de matrículas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabecera con buscador, lista de resultados a un lado y el plano del despiece grande, con zoom, al otro. En móvil se apilan. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --fg:#1d2321; --muted:#5d6763; --line:#d9ddda;
  --accent:#0b6e5e; --accent-fg:#ffffff; --mark:#e0301e; --warn:#8a5a00; --warn-bg:#fbf0d8;
  --paper:#ffffff;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:10px;min-height:calc(100dvh - 24px);grid-template-rows:auto auto auto minmax(0,1fr)}
header h1{font-size:1.2rem;margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
header p{margin:0;color:var(--muted)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 8%,transparent);background:var(--panel);color:var(--fg)}
.search input:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.search button{font:inherit;font-weight:500;padding:0 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);cursor:pointer}
.main{display:grid;gap:10px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);min-height:0}
@media(min-width:900px){.main{grid-template-columns:340px minmax(0,1fr);grid-template-rows:minmax(0,1fr);align-items:stretch}}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.items{max-height:186px;overflow-y:auto;margin:0;padding:0;list-style:none;overscroll-behavior:contain}
@media(min-width:900px){.list{display:flex;flex-direction:column;min-height:0}.items{max-height:none;flex:1;min-height:0}}
.items button{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:baseline;width:100%;text-align:left;font:inherit;padding:9px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.items button:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.items button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.items button[aria-current="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.mat{font-family:var(--f-mono);font-weight:600;font-size:.95rem}
.nom{color:var(--fg);overflow-wrap:anywhere}
.nom small{display:block;color:var(--warn);font-size:.78rem}
.empty{padding:18px 14px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chips button{flex:0 0 auto;font:inherit;font-size:.88rem;padding:7px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);color:var(--fg);cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.chips button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sala{display:inline-block;margin-top:2px;font-size:.76rem;color:var(--muted)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.info{padding:8px 14px;border-bottom:1px solid var(--line);min-height:52px;line-height:1.3}
.info b{font-family:var(--f-mono);font-size:1.05rem}
.info span{display:block;color:var(--muted);overflow-wrap:anywhere}
.info.warn{background:var(--warn-bg);color:var(--warn)}
.info.warn span{color:var(--warn)}
.view{position:relative;min-height:340px;height:100%;overflow:hidden;background:var(--paper);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.view.drag{cursor:grabbing}
.sheet{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.sheet img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.pin{position:absolute;width:0;height:0}
.pin i{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:4px solid var(--mark);border-radius:50%;background:color-mix(in srgb,var(--mark) 18%,transparent);transform:scale(var(--inv,1));animation:pulse 1.6s ease-out infinite}
.pin em{position:absolute;left:0;top:0;transform:translate(14px,-46px) scale(var(--inv,1));transform-origin:0 100%;font:600 14px var(--f-mono);font-style:normal;background:var(--mark);color:#fff;padding:3px 7px;border-radius:5px;white-space:nowrap}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--mark) 55%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
@media (prefers-reduced-motion:reduce){.pin i{animation:none}}
.ctl{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:grid;gap:6px}
.ctl button{width:42px;height:42px;font:600 20px/1 var(--f-body);border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);cursor:pointer}
.ctl button:focus-visible{outline:3px solid var(--accent)}
.hint{padding:8px 14px;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line)}

/* aspecto sobrio */
:root{--bg:#eef0f2;--panel:#fff;--fg:#1c2733;--muted:#5f6b78;--line:#d3d9df;--accent:#1f3a5f;--accent-fg:#fff;--mark:#e11d2e;color-scheme:light}
body{background:var(--bg)}
header{background:#1f2d3d;color:#fff;border-radius:10px;padding:12px 16px}
header h1{font-size:1.2rem;font-weight:600;color:#fff;letter-spacing:.01em}
.search input{border:1px solid #b9c2cc;border-radius:10px;padding:13px 16px;box-shadow:none;background:#fff}
.search input:focus-visible{outline:none;border-color:#1f3a5f;box-shadow:0 0 0 3px rgba(31,58,95,.2)}
.search button{border:1px solid #b9c2cc;border-radius:10px;padding:0 16px;background:#fff;color:#1c2733;font-weight:500}
.chips button{border:1px solid #b9c2cc;background:#fff;color:#1c2733;font-weight:500}
.chips button[aria-pressed="true"]{background:#1f3a5f;border-color:#1f3a5f;color:#fff;font-weight:600}
.list,.stage{border:1px solid var(--line);border-radius:10px;box-shadow:none}
.items button{border-bottom:1px solid #e6eaee}
.items button:hover{background:#f3f5f7}
.items button[aria-current="true"]{background:#e8eef5;box-shadow:inset 4px 0 0 #1f3a5f}
.mat{color:#1f3a5f}
.sala{color:#5f6b78}
.info{background:#fff;border-bottom:1px solid var(--line)}
.info b{color:#1f3a5f}
.ctl button{border:1px solid #b9c2cc;border-radius:8px;background:#fff;color:#1c2733;box-shadow:0 1px 3px rgba(0,0,0,.12)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Buscador de matrículas</h1>
  </header>
  <form class="search" id="f" role="search">
    <input id="q" type="search" placeholder="Introduce matrícula" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Matrícula o nombre">
    <button type="button" id="x">Borrar</button>
  </form>
  <div class="chips" id="chips" role="group" aria-label="Filtrar por sala"></div>
  <div class="main">
    <section class="list" aria-label="Resultados">
      <ul class="items" id="items"></ul>
    </section>
    <section class="stage">
      <div class="info" id="info"><b>Elige una matrícula</b><span>Se marca en el plano de su sala.</span></div>
      <div class="view" id="view" aria-label="Plano">
        <div class="sheet" id="sheet">
          <img id="img" alt="Plano de la sala" decoding="async">
        </div>
        <div class="ctl">
          <button type="button" id="zi" aria-label="Acercar">+</button>
          <button type="button" id="zo" aria-label="Alejar">−</button>
          <button type="button" id="zr" aria-label="Ver plano entero" title="Ver plano entero">⤢</button>
        </div>
      </div>
      
    </section>
  </div>
</div>

const ROOMS = {}; DB.rooms.forEach(r => ROOMS[r.id] = r);
const DATA = DB.entries;
let IW = 1000, IH = 1000, roomId = null, filt = 'all';
const $ = id => document.getElementById(id);
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
DATA.forEach(d => { d.k = norm(d.m); d.kn = norm(d.n + ' ' + (d.x || '')); d.kc = d.k.replace(/ /g,''); });

/* ---------- visor con zoom ---------- */
const view = $('view'), sheet = $('sheet');
let S = 1, X = 0, Y = 0, minS = 0.1;
function setRoom(id){
  const r = ROOMS[id]; IW = r.w; IH = r.h; roomId = id;
  sheet.style.width = IW + 'px'; sheet.style.height = IH + 'px';
}
function apply(){
  sheet.style.transform = `translate(${X}px,${Y}px) scale(${S})`;
  sheet.style.setProperty('--inv', (1/S).toFixed(4));
}
function clamp(){
  const w = view.clientWidth, h = view.clientHeight;
  const sw = IW*S, sh = IH*S;
  X = sw <= w ? (w - sw)/2 : Math.min(0, Math.max(w - sw, X));
  Y = sh <= h ? (h - sh)/2 : Math.min(0, Math.max(h - sh, Y));
}
function fit(){
  const w = view.clientWidth, h = view.clientHeight;
  minS = Math.min(w/IW, h/IH);
  S = minS; X = 0; Y = 0; clamp(); apply();
}
function zoomAt(f, cx, cy){
  const ns = Math.min(2.5, Math.max(minS, S*f));
  X = cx - (cx - X) * ns / S; Y = cy - (cy - Y) * ns / S; S = ns; clamp(); apply();
}
function centerOn(pts){
  const w = view.clientWidth, h = view.clientHeight;
  const px = pts.map(p => [p[0]/100*IW, p[1]/100*IH]);
  const x0 = Math.min(...px.map(p=>p[0])), x1 = Math.max(...px.map(p=>p[0]));
  const y0 = Math.min(...px.map(p=>p[1])), y1 = Math.max(...px.map(p=>p[1]));
  const bw = Math.max(x1-x0, 1), bh = Math.max(y1-y0, 1);
  let s = Math.min(w/(bw+900), h/(bh+900));
  s = Math.min(1.0, Math.max(minS, s));
  S = s; X = w/2 - (x0+x1)/2*S; Y = h/2 - (y0+y1)/2*S; clamp(); apply();
}
const ptrs = new Map(); let last = null;
view.addEventListener('pointerdown', e => {
  view.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  view.classList.add('drag'); last = null;
});
view.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  const r = view.getBoundingClientRect();
  if(ptrs.size === 1){ X += e.clientX - prev[0]; Y += e.clientY - prev[1]; clamp(); apply(); }
  else if(ptrs.size === 2){
    const [a,b] = [...ptrs.values()];
    const d = Math.hypot(a[0]-b[0], a[1]-b[1]);
    const c = [(a[0]+b[0])/2 - r.left, (a[1]+b[1])/2 - r.top];
    if(last){ X += c[0]-last.c[0]; Y += c[1]-last.c[1]; zoomAt(d/last.d, c[0], c[1]); }
    last = {d, c};
  }
});
const up = e => { ptrs.delete(e.pointerId); last = null; if(!ptrs.size) view.classList.remove('drag'); };
view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);
view.addEventListener('wheel', e => {
  e.preventDefault(); const r = view.getBoundingClientRect();
  zoomAt(e.deltaY < 0 ? 1.25 : 0.8, e.clientX - r.left, e.clientY - r.top);
}, {passive:false});
$('zi').onclick = () => zoomAt(1.5, view.clientWidth/2, view.clientHeight/2);
$('zo').onclick = () => zoomAt(1/1.5, view.clientWidth/2, view.clientHeight/2);
$('zr').onclick = () => { clearPins(); fit(); };
window.addEventListener('resize', () => { const w = view.clientWidth, h = view.clientHeight; minS = Math.min(w/IW, h/IH); if(S < minS) S = minS; clamp(); apply(); });

/* ---------- marcas ---------- */
function clearPins(){ sheet.querySelectorAll('.pin').forEach(n => n.remove()); }
function addPin(p, label){
  const d = document.createElement('div'); d.className = 'pin';
  d.style.left = (p[0]/100*IW) + 'px'; d.style.top = (p[1]/100*IH) + 'px';
  d.innerHTML = '<i></i><em></em>'; d.querySelector('em').textContent = label;
  sheet.appendChild(d);
}

/* ---------- búsqueda ---------- */
let cur = null, shown = [];
function search(q){
  const n = norm(q), c = n.replace(/ /g,'');
  const pool = filt === 'all' ? DATA : DATA.filter(d => d.r === filt);
  if(!n) return pool.slice().sort((a,b) => a.m < b.m ? -1 : a.m > b.m ? 1 : 0);
  const words = n.split(' ');
  const res = [];
  for(const d of pool){
    let sc = 0;
    if(d.kc === c) sc = 4;
    else if(d.kc.startsWith(c)) sc = 3;
    else if(d.kc.includes(c)) sc = 2;
    else if(words.every(w => d.kn.includes(w) || d.k.includes(w))) sc = 1;
    if(sc) res.push([sc, d]);
  }
  res.sort((a,b) => b[0]-a[0] || (a[1].m < b[1].m ? -1 : a[1].m > b[1].m ? 1 : 0));
  return res.map(r => r[1]);
}
function render(){
  const q = $('q').value;
  shown = search(q);
  const ul = $('items'); ul.innerHTML = '';
    if(!shown.length){ const li = document.createElement('li'); li.className='empty'; li.textContent = 'No hay ninguna matrícula ni nombre que coincida. Prueba con menos letras o quita el filtro de sala.'; ul.appendChild(li); return; }
  for(const d of shown.slice(0, 400)){
    const li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button'; if(cur === d) b.setAttribute('aria-current','true');
    const m = document.createElement('span'); m.className = 'mat'; m.textContent = d.m;
    const n = document.createElement('span'); n.className = 'nom';
    n.appendChild(document.createTextNode(d.n || 'Sin nombre en el plano'));
    const s = document.createElement('span'); s.className = 'sala';
    s.textContent = ROOMS[d.r].sala + (d.p.length > 1 ? ' · ' + d.p.length + ' posiciones' : '') + (d.p.length ? '' : ' · sin posición en el plano');
    n.appendChild(document.createElement('br')); n.appendChild(s);
    b.append(m, n); b.onclick = () => select(d); li.appendChild(b); ul.appendChild(li);
  }
}
function showRoom(id, cb){
  if(roomId === id){ cb(); return; }
  setRoom(id);
  const done = () => { img.onload = null; fit(); cb(); };
  img.onload = done; img.src = ROOMS[id].img;
}
function select(d){
  cur = d; clearPins();
  const info = $('info'); info.classList.toggle('warn', !d.p.length);
  info.innerHTML = '<b></b><span></span>'; info.querySelector('b').textContent = d.m + ' · ' + ROOMS[d.r].sala;
  const sp = info.querySelector('span');
  showRoom(d.r, () => {
    if(d.p.length){
      sp.textContent = (d.n || 'Sin nombre en el plano') + (d.p.length > 1 ? ' · Aparece ' + d.p.length + ' veces en el plano: se marcan todas' : '');
      d.p.forEach(p => addPin(p, d.m)); centerOn(d.p);
    } else {
      sp.textContent = (d.n || 'Sin nombre en el plano') + ' · No tiene posición en el plano todavía.'; fit();
    }
  });
  render();
  view.scrollIntoView({block:'nearest', behavior:'smooth'});
}
function drawChips(){
  const box = $('chips'); box.innerHTML = '';
  const add = (id, label) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.setAttribute('aria-pressed', String(filt === id)); b.onclick = () => { filt = id; drawChips(); render(); }; box.appendChild(b); };
  add('all', 'Todas las salas'); DB.rooms.forEach(r => add(r.id, r.sala));
}
$('q').addEventListener('input', render);
$('x').onclick = () => { $('q').value = ''; render(); $('q').focus(); };
$('f').addEventListener('submit', e => { e.preventDefault(); if(shown.length){ select(shown[0]); $('q').blur(); } });

const img = $('img');
setRoom(DB.rooms[0].id); img.src = DB.rooms[0].img;
function boot(){ fit(); }
img.onload = boot;
drawChips(); render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
