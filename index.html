<title>Revisiones de Limpieza</title>

<style>
/* Layout: una columna de mano, tarjeta del elemento arriba, botones grandes para dedo con guante abajo */
:root{
  --bg:#eef2f4; --surface:#ffffff; --fg:#14212b; --muted:#5d6e7a; --line:#d3dce2;
  --steel:#1f4e6b; --ok:#1d7a4c; --warn:#c2410c; --blank:#7a8794; --blue:#1d4ed8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171d; --surface:#17232c; --fg:#e6edf1; --muted:#93a4b0; --line:#2a3a46;
  --steel:#6fa8cc; --ok:#3fbf7f; --warn:#f08a4b; --blank:#8a97a3; --blue:#7aa2ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171d; --surface:#17232c; --fg:#e6edf1; --muted:#93a4b0; --line:#2a3a46;
  --steel:#6fa8cc; --ok:#3fbf7f; --warn:#f08a4b; --blank:#8a97a3; --blue:#7aa2ff; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--display);margin:0;letter-spacing:.01em}
h1{font-size:28px} h2{font-size:22px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
button{font-family:var(--body);font-size:17px;font-weight:600;border-radius:10px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--fg);min-height:54px;padding:8px 12px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
button:active{transform:scale(.98)}
.primary{background:var(--steel);border-color:var(--steel);color:var(--bg)}
.okb{background:var(--ok);border-color:var(--ok);color:var(--bg);font-size:20px}
.ghost{background:transparent;min-height:44px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.code{font-family:var(--display);font-size:46px;line-height:1;color:var(--steel)}
.name{font-size:19px;font-weight:500}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--steel)}
.confirm{border-left:4px solid var(--ok);background:var(--surface);padding:10px 12px;border-radius:6px;font-size:15px}
.confirm b{font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1.5px solid var(--steel);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px}
.step button{width:54px;font-size:24px;padding:0}
.num{font-family:var(--display);font-size:36px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
input[type=number],input[type=text],textarea{font:inherit;font-size:18px;border:1.5px solid var(--line);border-radius:10px;
  padding:10px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
input[type=number]{width:90px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;min-width:58px}
.seg button[aria-pressed=true]{background:var(--steel);color:var(--bg)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;
  border-radius:0;border-left:0;border-right:0;border-top:0;min-height:0;font-weight:500;font-size:15px}
.li:last-child{border-bottom:0}
.li span:first-child{min-width:0}
.li .r{color:var(--muted);text-align:right;flex-shrink:0;max-width:55%}
.li.inc .r{color:var(--blue);font-weight:600}
.li.cur{background:var(--bg)}
pre{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;
  word-break:break-word;margin:0;max-height:260px;overflow:auto;font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--muted)}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1.5px solid var(--line)}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.warnbox{border-left:4px solid var(--warn);padding:8px 12px;background:var(--surface);border-radius:6px;font-size:14px}
.fotobtn{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:18px;border-radius:10px;
  border:1.5px dashed var(--steel);color:var(--steel);background:var(--surface);min-height:54px;padding:8px 12px;cursor:pointer;text-align:center}
.fotobtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.fotobtn:focus-within{outline:3px solid var(--steel);outline-offset:2px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gal figure{margin:0;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.gal figcaption{padding:6px 8px;font-size:13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.gal figcaption b{font-family:var(--display);font-size:17px;color:var(--steel)}
.gal button{min-height:40px;font-size:14px;border-radius:0;border:0;border-top:1px solid var(--line)}
.miss{display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.avatar{width:42px;height:42px;min-height:0;padding:0;border-radius:50%;background:var(--steel);border-color:var(--steel);color:var(--bg);
  font-family:var(--display);font-size:18px;letter-spacing:.03em}
.hola{font-family:var(--display);font-size:34px;line-height:1.05;margin:0}
.sub{margin:4px 0 0;color:var(--muted);font-size:16px}
.encurso{border:2px solid var(--steel);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.pill{align-self:flex-start;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--steel);
  border:1.5px solid var(--steel);border-radius:99px;padding:2px 10px}
.salas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sala{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;min-height:132px;border-radius:14px}
.sala svg{width:30px;height:30px;color:var(--steel);margin-bottom:6px}
.sala .t{font-family:var(--display);font-size:22px;line-height:1.05}
.sala .d{font-size:13px;color:var(--muted);font-weight:500}
.prox{display:flex;flex-wrap:wrap;gap:6px}
.prox span{font-size:13px;color:var(--muted);border:1.5px dashed var(--line);border-radius:8px;padding:4px 10px}
.aviso{border-left:4px solid var(--warn);background:var(--surface);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style>

function leerFoto(file){return new Promise((ok,ko)=>{const fr=new FileReader();fr.onerror=ko;fr.onload=()=>{const im=new Image();

function dataToBlob(u){const [h,b]=u.split(",");const bin=atob(b);const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:"image/jpeg"})}
function descargaDirecta(filename,blob){const u=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function bajar(filename,data,b){const t=b.textContent;
  const blob=data instanceof Blob?data:new Blob([data]);
  try{
    let hecho=false;
    /* en móvil: hoja de compartir (Guardar en Archivos / Fotos); si falla, descarga directa */
    if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)&&navigator.canShare&&window.File){
      const f=new File([blob],filename,{type:blob.type});
      if(navigator.canShare({files:[f]})){
        try{await navigator.share({files:[f],title:filename});hecho=true}
        catch(e){if(e&&e.name==="AbortError"){b.textContent="Cancelado";setTimeout(()=>b.textContent=t,2500);return}}
      }
    }
    if(!hecho)descargaDirecta(filename,blob);
    b.textContent="Guardado ✓"
  }catch(e){b.textContent="No se pudo guardar"}
  setTimeout(()=>b.textContent=t,2500)}
function bajarUna(c,slot,b){bajar(nombreFoto(c,slot),dataToBlob(slot===2?FOTOS[k2(c)]:FOTOS[c]),b)}
async function bajarZip(b){if(!window.JSZip){b.textContent="No se pudo preparar el zip";return}
  const z=new JSZip();ITEMS.forEach(([c])=>{if(isInc(S.res[c]))fotosItem(c).forEach(p=>z.file(nombreFoto(p.c,p.slot),p.url.split(",")[1],{base64:true}))});
  b.textContent="Preparando…";const blob=await z.generateAsync({type:"blob"});b.textContent="Guardar todas (zip)";
  bajar(`${fechaISO()}_${SALA_CORTO}_fotos.zip`,blob,b)}

function copy(id,b){const t=document.getElementById(id).textContent;
  const ok=()=>{b.textContent="Copiado ✓";setTimeout(()=>render(),1500)};
  try{navigator.clipboard.writeText(t).then(ok,()=>sel(id))}catch(e){sel(id)}}
function sel(id){const r=document.createRange();r.selectNodeContents(document.getElementById(id));const s=getSelection();s.removeAllRanges();s.addRange(r)}

function segCross(a,b){const o=(p,q,r)=>Math.sign((q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]));
  const [p1,p2]=a,[p3,p4]=b;return o(p1,p2,p3)*o(p1,p2,p4)<0&&o(p3,p4,p1)*o(p3,p4,p2)<0}

function ptSeg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy||1;let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l2;t=Math.max(0,Math.min(1,t));
  return Math.hypot(p[0]-(a[0]+t*dx),p[1]-(a[1]+t*dy))}
function segRoza(A,B){let c=0;for(let s=1;s<16;s++){const t=s/16;if(ptSeg([A[0][0]+(A[1][0]-A[0][0])*t,A[0][1]+(A[1][1]-A[0][1])*t],B[0],B[1])<6)c++}return c>=3}

/* notes: [{code,text}] ; width(text,fs) -> ancho en unidades del dibujo */
function layoutNotas(notes,width,cfg){
  // franjas libres del plano: arriba (3 filas, sobre la sala) y abajo (bajo todo el dibujo)
  const BANDS=cfg.bands;
  const g={};Object.keys(BANDS).forEach(k=>g[k]=[]);
  const cnt={};Object.keys(BANDS).forEach(k=>cnt[k]=0);
  const zk=a=>{const o=Object.keys(cfg.zones).map(k=>{const z=cfg.zones[k],dx=Math.max(z[0]-a[0],0,a[0]-z[2]),dy=Math.max(z[1]-a[1],0,a[1]-z[3]);return [Math.hypot(dx,dy),k]}).sort((p,q)=>p[0]-q[0]);
    for(const [,k] of o){const B=BANDS[k];if(cnt[k]<B.cols.length*B.rows.length){cnt[k]++;return k}}return o[0][1]};
  notes.forEach(n=>{const a=n.at||cfg.pos[n.code];if(a)g[cfg.zones?zk(a):cfg.assign?cfg.assign(a):(a[1]<cfg.split?"top":"bot")].push({...n,a})});
  const capTop=BANDS.top?BANDS.top.cols.length*BANDS.top.rows.length:Infinity;
  if(cfg.over)for(const [k,to] of Object.entries(cfg.over)){const cap=BANDS[k].cols.length*BANDS[k].rows.length;if(g[k].length>cap){g[k].sort((p,q)=>Math.abs(q.a[1]-BANDS[k].rows[0])-Math.abs(p.a[1]-BANDS[k].rows[0]));while(g[k].length>cap)g[to].push(g[k].shift())}}
  if(BANDS.top&&BANDS.bot&&g.top.length>capTop){g.top.sort((p,q)=>q.a[1]-p.a[1]);while(g.top.length>capTop)g.bot.push(g.top.shift())}
  const out=[];
  for(const key of Object.keys(BANDS)){
    const B=BANDS[key], list=g[key];if(!list.length)continue;
    list.sort((p,q)=>p.a[0]-q.a[0]);
    const nc=B.cols.length, nr=B.rows.length;
    // nº de columnas usadas: tantas como haga falta, repartidas por la franja
    const k=Math.min(nc,list.length), per=Math.ceil(list.length/k);
    const used=k===1?[Math.max(0,Math.min(nc-1,Math.floor((list[0].a[0]-B.cols[0])/(B.colW))))]:
      Array.from({length:k},(_,j)=>Math.round(j*(nc-1)/(k-1)));
    const items=[];
    if(B.side){ /* franja lateral: cada texto en la fila más cercana a la altura de su matrícula, sin pisarse */
      list.sort((p,q)=>p.a[1]-q.a[1]);
      for(let c0=0;c0<list.length;c0+=nr){const grp=list.slice(c0,c0+nr),col=Math.min(nc-1,c0/nr);let prev=-1;
        const idx=grp.map(n=>{let r=Math.round((n.a[1]-B.rows[0])/(B.rows[1]-B.rows[0]));r=Math.max(r,prev+1);prev=r;return r});
        let nxt=nr;for(let i=idx.length-1;i>=0;i--){idx[i]=Math.min(idx[i],nxt-1);nxt=idx[i]}
        grp.forEach((n,i)=>items.push({n,col,row:idx[i]}))}}
    else
    for(let j=0;j<k;j++){
      const grp=list.slice(j*per,(j+1)*per);if(!grp.length)continue;
      const cx=B.cols[used[j]];
      // fila: arriba la flecha más vertical, abajo la más tumbada (así no se cruzan)
      const steep=n=>{const dx=Math.abs(n.a[0]-(cx+B.colW/2)),dy=Math.abs(n.a[1]-B.rows[0]);return dy/(dx+1)};
      grp.sort((p,q)=>key!=="top"?steep(q)-steep(p):steep(p)-steep(q));
      // en la franja de arriba las flechas bajan: la fila de abajo, la más vertical
      grp.forEach((n,r)=>items.push({n,col:used[j],row:key!=="top"?r:(nr-grp.length)+r}));
    }
    const fit=(t)=>{let fs=B.fs,tt=t;while(width(tt,fs)>B.colW-12&&fs>6.4)fs-=0.2;
      while(width(tt,fs)>B.colW-12&&tt.length>6)tt=tt.slice(0,-2).trimEnd()+"…";return [tt,fs]};
    const geom=()=>{const colMax={};
      const pre=items.map(it=>{const [tt,fs]=fit(it.n.text),w=width(tt,fs);colMax[it.col]=Math.max(colMax[it.col]||0,w);return {it,tt,fs,w}});
      // las flechas salen todas del mismo borde de la columna, para no pisar los textos de otras filas
      return pre.map(({it,tt,fs,w})=>{const x=B.cols[it.col],y=B.rows[it.row],right=it.n.a[0]>=x+w/2;
        const ex=x+colMax[it.col]+5;
        return {it,tt,fs,x,y,w,right,ul:right?[x,ex]:[x-5,x+w],seg:[right?[ex,y+2.5]:[x-5,y+2.5],it.n.a]}})};
    const crosses=G=>{let c=0;const wc=cfg.avoid?6:1;for(let i=0;i<G.length;i++)for(let j=i+1;j<G.length;j++)if(segCross(G[i].seg,G[j].seg))c+=wc;
      /* cfg.avoid: además evita (con menos peso que un cruce) flechas que se pisan o que pasan pegadas a la matrícula de otra */
      if(cfg.avoid){for(let i=0;i<G.length;i++){for(let j=i+1;j<G.length;j++)if(segRoza(G[i].seg,G[j].seg)||segRoza(G[j].seg,G[i].seg))c+=3;
        for(let j=0;j<G.length;j++)if(j!==i&&ptSeg(G[j].it.n.a,G[i].seg[0],G[i].seg[1])<22)c++}}
      return c};
    // mejora: cambia de hueco (o a un hueco libre) mientras quiten cruces
    const free=()=>{const occ=new Set(items.map(i=>i.col+","+i.row));const f=[];
      B.cols.forEach((_,c)=>B.rows.forEach((_,r)=>{if(!occ.has(c+","+r))f.push([c,r])}));return f};
    let cur=crosses(geom());
    for(let it=0;it<80&&cur>0;it++){const noFree=!!B.side;let best=cur,mv=null;
      for(let i=0;i<items.length;i++){
        for(let j=i+1;j<items.length;j++){const A=items[i],Bb=items[j];
          [A.col,Bb.col]=[Bb.col,A.col];[A.row,Bb.row]=[Bb.row,A.row];const v=crosses(geom());
          [A.col,Bb.col]=[Bb.col,A.col];[A.row,Bb.row]=[Bb.row,A.row];if(v<best){best=v;mv=["s",i,j]}}
        if(!noFree)for(const [c,r] of free()){const A=items[i],oc=A.col,or=A.row;A.col=c;A.row=r;const v=crosses(geom());
          A.col=oc;A.row=or;if(v<best){best=v;mv=["m",i,c,r]}}}
      if(!mv)break;
      if(mv[0]==="s"){const A=items[mv[1]],Bb=items[mv[2]];[A.col,Bb.col]=[Bb.col,A.col];[A.row,Bb.row]=[Bb.row,A.row]}
      else{items[mv[1]].col=mv[2];items[mv[1]].row=mv[3]}
      cur=best}
    geom().forEach(o=>out.push({code:o.it.n.code,text:o.tt,x:o.x,y:o.y,fs:o.fs,ul:o.ul,from:o.seg[0],to:o.it.n.a}));
  }
  return out;
}


/* ===== Generar el PDF del plano relleno ===== */
const AZUL=[0.11,0.31,0.85], GRIS=[0.33,0.33,0.33];
function wa(s){return String(s).replace(/[^\x20-\x7E -ÿ·—–~…’‘“”€]/g,"")}
function b64ToBytes(u){const b=atob(u.split(",")[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function genPlano(){
  const {PDFDocument,StandardFonts,rgb}=PDFLib;
  const src=await (await fetch(CFG.pdf)).arrayBuffer();
  const doc=await PDFDocument.load(src);
  const page=doc.getPages()[0], W=page.getWidth(), H=page.getHeight(), DHp=CFG.DH||PL_DH, K=H/DHp, DW=W/K;
  const F=await doc.embedFont(StandardFonts.HelveticaBold), FR=await doc.embedFont(StandardFonts.Helvetica);
  const X=x=>x*K, Y=y=>(DHp-y)*K;
  const txtAt=(t,x,y,fs,font,col)=>page.drawText(wa(t),{x:X(x),y:Y(y),size:fs*K,font,color:rgb(...col)});
  // cabecera
  [S.fecha,S.ini,S.fin,S.nombre||NOMBRE,S.tq||""].forEach((v,i)=>{const h=CFG.hdr||{x:145,y0:25,pitch:15.5,fs:9};if(v)txtAt(v,h.x,h.y0+i*h.pitch,h.fs,F,AZUL)});
  // listado
  const nombres={...Object.fromEntries(ITEMS),...(CFG.lnames||{})};
  if(CFG.lines)CFG.lines.forEach(([cs,lx,ly,rm])=>{
    const parts=cs.map(c=>{const r=S.res[c];if(!r||!(isInc(r)||r.t==="ok"))return "";const t=txt(r,1);const m=c.match(/\(([^)]*)\)/);return (cs.length>1&&m?m[1]+": ":"")+t}).filter(Boolean);
    if(!parts.length)return;let fs=CFG.lfs,t=wa(parts.join(" · "));
    while(F.widthOfTextAtSize(t,fs)>(rm||CFG.lroom)&&fs>3.6)fs-=0.2;
    while(F.widthOfTextAtSize(t,fs)>(rm||CFG.lroom)&&t.length>4)t=t.slice(0,-2)+"…";
    txtAt(t,lx,ly,fs,F,AZUL)});
  CFG.list.forEach((c,i)=>{
    const y=(CFG.y0||58)+i*CFG.pitch, raya=RAYA.includes(c);
    const v=raya?"—":(S.res[c]?(isInc(S.res[c])||S.res[c].t==="ok"?txt(S.res[c]):""):"");
    if(!v)return;
    const nameEnd=CFG.LX+66+(nombres[c]?FR.widthOfTextAtSize(wa(nombres[c]),6.6):60);
    const room=DW-22-nameEnd-6;let fs=6.6,t=wa(v);
    while(F.widthOfTextAtSize(t,fs)>room&&fs>4.6)fs-=0.2;
    while(F.widthOfTextAtSize(t,fs)>room&&t.length>4)t=t.slice(0,-2)+"…";
    txtAt(t,DW-22-F.widthOfTextAtSize(t,fs),y+1.5,fs,F,raya?GRIS:AZUL);
  });
  // textos con flecha en el dibujo
  const notas=ITEMS.filter(([c])=>isInc(S.res[c])).flatMap(([c])=>{const r=S.res[c],d=CFG.dup&&CFG.dup[c];
    if(r.pts&&CFG.vias)return r.pts.map(p=>{const pl=CFG.vias[c],a=p.j&&CFG.pos[p.j],at=a?cercano(pl,a):cercano(pl,CFG.pos[c]);
      return {code:c,text:wa((NOMLIN[c]||c)+": "+ptxt(p).replace(/ junto a .*$/,"")),at}});
    if(r.pts&&CFG.lineY)return r.pts.map(p=>{let at;const a=p.j&&CFG.pos[p.j];
      if(a){const tr=CFG.tramos.find(t=>a[1]>=t[0]&&a[1]<t[1])||CFG.tramos[0];at=[Math.max(90,Math.min(990,a[0])),tr[2]+CFG.lineY[c]]}
      return {code:c,text:wa((NOMLIN[c]||c)+": "+ptxt(p).replace(/ junto a .*$/,"")),at}});
    return [{code:c,text:wa(txt(r,1)),at:d&&r.lado?d[r.lado]:undefined}]});
  // otras incidencias: recuadro azul a la derecha, debajo del listado; con flecha solo si se dijo junto a qué
  const otras=S.otras||[];
  otras.forEach((o,i)=>{const a=o.j&&CFG.pos[o.j];if(a)notas.push({code:o.j,text:wa("Otra: "+o.t),at:[a[0],a[1]+6*notas.filter(n=>n.code===o.j).length]})});
  if(otras.length&&CFG.otrasBox){
    const B=CFG.otrasBox, maxW=B.w;
    const wrap=(t,fs)=>{const out=[];let cur="";for(const w of wa(t).split(/\s+/)){const nx=cur?cur+" "+w:w;
      if(FR.widthOfTextAtSize(nx,fs)>maxW&&cur){out.push(cur);cur=w}else cur=nx}if(cur)out.push(cur);return out};
    let fs=6.6,lines=[];
    for(;;){lines=otras.flatMap(o=>wrap("- "+o.t+(o.j?" (junto a "+o.j+")":""),fs));
      const room=Math.floor((B.bottom-(B.y0+9+0.8*fs))/(fs+2.2))+1;
      if(lines.length<=room||fs<=4.8)break;fs-=0.2}
    const room=Math.max(1,Math.floor((B.bottom-(B.y0+9+0.8*fs))/(fs+2.2))+1);
    if(lines.length>room){lines=lines.slice(0,room);lines[room-1]=lines[room-1].replace(/\s*\S{0,3}$/,"")+"…"}
    txtAt("OTRAS INCIDENCIAS",B.x,B.y0,7.2,F,AZUL);
    page.drawLine({start:{x:X(B.x),y:Y(B.y0+2.5)},end:{x:X(B.x+B.w),y:Y(B.y0+2.5)},thickness:0.7*K,color:rgb(...AZUL)});
    lines.forEach((l,i)=>txtAt(l,B.x,B.y0+9+fs+i*(fs+2.2)-fs*0.2,fs,FR,AZUL));
  }
  const L=layoutNotas(notas,(t,fs)=>F.widthOfTextAtSize(t,fs),CFG);
  L.forEach(o=>{
    txtAt(o.text,o.x,o.y,o.fs,F,AZUL);
    page.drawLine({start:{x:X(o.ul[0]),y:Y(o.y+2.5)},end:{x:X(o.ul[1]),y:Y(o.y+2.5)},thickness:0.8*K,color:rgb(...AZUL)});
    const [x1,y1]=o.from,[ax,ay]=o.to, dx=ax-x1, dy=ay-y1, d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d;
    const ex=ax-ux*7, ey=ay-uy*7;
    page.drawLine({start:{x:X(x1),y:Y(y1)},end:{x:X(ex),y:Y(ey)},thickness:1.1*K,color:rgb(...AZUL)});
    const hx=ex-ux*7, hy=ey-uy*7, px=-uy*3.5, py=ux*3.5;
    page.drawSvgPath(`M ${X(ex)} ${X(ey)} L ${X(hx+px)} ${X(hy+py)} L ${X(hx-px)} ${X(hy-py)} Z`,{x:0,y:H,color:rgb(...AZUL)});
  });
  // páginas de fotos (4 por hoja)
  const fotos=ITEMS.filter(([c])=>isInc(S.res[c])).flatMap(([c])=>fotosItem(c));
  const kk=W/1190.55;
  for(let k=0;k<fotos.length;k+=4){
    const pg=doc.addPage([W,H]);
    pg.drawText(wa(`Fotos de incidencias · ${SALA} · ${S.fecha}`),{x:30*kk,y:H-50*kk,size:18*kk,font:F,color:rgb(0.12,0.16,0.2)});
    const cw=(W-90*kk)/2, ch=(H-130*kk)/2;
    for(let j=0;j<4&&k+j<fotos.length;j++){
      const {c,slot,url,lab}=fotos[k+j], img=await doc.embedJpg(b64ToBytes(url));
      const cx=30*kk+(j%2)*(cw+30*kk), cy=H-80*kk-(Math.floor(j/2)+1)*ch-Math.floor(j/2)*10*kk;
      const capH=36*kk, sc=Math.min(cw/img.width,(ch-capH)/img.height), iw=img.width*sc, ih=img.height*sc;
      pg.drawImage(img,{x:cx+(cw-iw)/2,y:cy+capH+(ch-capH-ih)/2,width:iw,height:ih});
      const cap=wa(lab);let fz=17*kk;while(F.widthOfTextAtSize(cap,fz)>cw&&fz>9*kk)fz-=kk;
      pg.drawText(cap,{x:cx,y:cy+14*kk,size:fz,font:F,color:rgb(...AZUL)});
    }
  }
  return await doc.save();
}
async function bajarPlano(b){const t=b.textContent;b.textContent="Generando…";
  try{const bytes=await genPlano();b.textContent=t;await bajar(`${fechaISO()}_${SALA_CORTO}_plano.pdf`,new Blob([bytes],{type:"application/pdf"}),b)}
  catch(e){b.textContent="Error al generar el plano";console.error(e);setTimeout(()=>b.textContent=t,2500)}}

setSala(S&&S.sala||"china");render();cargarFotos().then(render);
</script>
